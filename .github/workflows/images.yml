name: CI Images

# Builds and publishes CI container images.
on:
  pull_request:
    paths:
      - "ci/images/**"
      - ".github/workflows/images.yml"

  push:
    branches:
      - master
    paths:
      - "ci/images/**"
      - ".github/workflows/images.yml"

  workflow_dispatch:

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write


jobs:

  build:
    name: ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: STM32
            image: rtos-ci-stm32
            context: .
            dockerfile: ci/images/stm32/Dockerfile

          - name: Doxygen
            image: rtos-ci-doxygen
            context: .
            dockerfile: ci/images/doxygen/Dockerfile

          - name: Verification
            image: rtos-ci-verification
            context: .
            dockerfile: ci/images/verification/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}

          # PR: build only
          # master/manual: build and publish
          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}