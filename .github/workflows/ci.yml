name: RTOS CI

on:
  push:

  pull_request:

  workflow_dispatch:


concurrency:
  group: rtos-ci-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  packages: read


env:
  FIRMWARE_DIR: stm32l475-rtos


jobs:

  # ===========================================================================
  # Formatting
  # ===========================================================================

  format:
    name: Formatting

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository_owner }}/rtos-ci-stm32:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        working-directory: ${{ env.FIRMWARE_DIR }}
        run: |
          set -euo pipefail

          find App Config Core Port RTOS \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -print0 |
          xargs -0 clang-format \
            --dry-run \
            --Werror


  # ===========================================================================
  # Firmware builds
  # ===========================================================================

  build:
    name: Build - ${{ matrix.variant }}

    needs:
      - format

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository_owner }}/rtos-ci-stm32:latest

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false

      matrix:
        include:
          - variant: sensor
            rtos_project: PROJECT_SENSOR
            trace_enabled: "1"

          - variant: queue
            rtos_project: PROJECT_QUEUE
            trace_enabled: "1"

          - variant: scheduler
            rtos_project: PROJECT_SCHEDULER
            trace_enabled: "1"

          - variant: delay
            rtos_project: PROJECT_DELAY
            trace_enabled: "1"

          - variant: semaphore
            rtos_project: PROJECT_SEMAPHORE
            trace_enabled: "1"

          - variant: mutex
            rtos_project: PROJECT_MUTEX
            trace_enabled: "1"

          - variant: sensor-no-trace
            rtos_project: PROJECT_SENSOR
            trace_enabled: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        working-directory: ${{ env.FIRMWARE_DIR }}
        run: |
          cmake \
            --preset Debug \
            -B "build/ci-${{ matrix.variant }}" \
            -DRTOS_PROJECT="${{ matrix.rtos_project }}" \
            -DRTOS_TRACE_ENABLED="${{ matrix.trace_enabled }}"

      - name: Build
        working-directory: ${{ env.FIRMWARE_DIR }}
        run: |
          cmake \
            --build "build/ci-${{ matrix.variant }}" \
            --parallel

      - name: Prepare firmware artifacts
        working-directory: ${{ env.FIRMWARE_DIR }}
        run: |
          set -euo pipefail

          BUILD_DIR="build/ci-${{ matrix.variant }}"
          ARTIFACT_DIR="ci-artifacts/${{ matrix.variant }}"

          mkdir -p "$ARTIFACT_DIR"

          cp \
            "$BUILD_DIR/rtos.elf" \
            "$ARTIFACT_DIR/rtos.elf"

          cp \
            "$BUILD_DIR/rtos.map" \
            "$ARTIFACT_DIR/rtos.map"

          arm-none-eabi-objcopy \
            -O ihex \
            "$BUILD_DIR/rtos.elf" \
            "$ARTIFACT_DIR/rtos.hex"

          arm-none-eabi-objcopy \
            -O binary \
            "$BUILD_DIR/rtos.elf" \
            "$ARTIFACT_DIR/rtos.bin"

          arm-none-eabi-size \
            "$BUILD_DIR/rtos.elf" |
            tee "$ARTIFACT_DIR/size.txt"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ env.FIRMWARE_DIR }}/ci-artifacts/${{ matrix.variant }}/
          retention-days: 7
          if-no-files-found: error

      - name: Upload compile database
        uses: actions/upload-artifact@v7
        with:
          name: compile-db-${{ matrix.variant }}
          path: ${{ env.FIRMWARE_DIR }}/build/ci-${{ matrix.variant }}/compile_commands.json
          retention-days: 7
          if-no-files-found: error


  # ===========================================================================
  # Static analysis
  # ===========================================================================

  cppcheck:
    name: Cppcheck

    needs:
      - build

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository_owner }}/rtos-ci-stm32:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download compile databases
        uses: actions/download-artifact@v8
        with:
          pattern: compile-db-*
          path: ${{ env.FIRMWARE_DIR }}/compile-databases

      - name: Run cppcheck
        working-directory: ${{ env.FIRMWARE_DIR }}
        run: |
          set -uo pipefail

          mkdir -p cppcheck-reports

          failed=0

          for db in compile-databases/compile-db-*/compile_commands.json; do
            artifact_dir="$(basename "$(dirname "$db")")"
            variant="${artifact_dir#compile-db-}"

            report="cppcheck-reports/${variant}.txt"

            echo
            echo "============================================================"
            echo "Cppcheck configuration: ${variant}"
            echo "Compile database:        ${db}"
            echo "============================================================"

            if cppcheck \
              --project="$db" \
              --enable=warning,style,performance,portability \
              --error-exitcode=1 \
              --suppress=missingIncludeSystem \
              --suppress=preprocessorErrorDirective \
              -iLibs/SEGGER \
              -iCore/Src/syscalls.c \
              2>"$report"
            then
              echo "Cppcheck ${variant}: OK"
            else
              echo "Cppcheck ${variant}: FAILED"
              failed=1
            fi

            cat "$report"
          done

          exit "$failed"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-reports
          path: ${{ env.FIRMWARE_DIR }}/cppcheck-reports/
          retention-days: 7


  # ===========================================================================
  # TeSSLa verification
  # ===========================================================================

  verification:
    name: TeSSLa verification

    needs:
      - build

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository_owner }}/rtos-ci-verification:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run verification
        working-directory: verification
        run: |
          set -euo pipefail

          python3 tessla_verify.py list
          python3 tessla_verify.py test --rust


  # ===========================================================================
  # Doxygen
  # ===========================================================================

  docs:
    name: Doxygen

    needs:
      - cppcheck
      - verification

    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository_owner }}/rtos-ci-doxygen:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate documentation
        working-directory: ${{ env.FIRMWARE_DIR }}
        run: |
          set -euo pipefail

          doxygen Doxyfile

          test -f docs/html/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.FIRMWARE_DIR }}/docs/html


  # ===========================================================================
  # GitHub Pages
  # ===========================================================================

  pages:
    name: GitHub Pages

    needs:
      - docs

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5