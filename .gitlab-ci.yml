stages:
  - docker
  - format
  - configure
  - build
  - analyze

default:
  image: stm32-ci
  tags:
    - runner
  interruptible: true

variables:
  BUILD_DIR: build

build_image:
  stage: docker
  tags:
    - runner
  script:
    - docker build -t stm32-ci -f gitlab-runner/Dockerfile .
  rules:
    - changes:
        - gitlab-runner/Dockerfile
        - .gitlab-ci.yml
      when: on_success

format:
  stage: format
  script:
    - find Core -type f \( -name "*.c" -o -name "*.h" -o -name "*.s" \) | xargs clang-format --dry-run --Werror

configure:
  stage: configure
  script:
    - cmake -S . -B ${BUILD_DIR} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
  artifacts:
    paths:
      - ${BUILD_DIR}/
    expire_in: 1 week

build:
  stage: build
  needs: ["configure"]
  script:
    - cmake --build ${BUILD_DIR} --parallel
    - arm-none-eabi-size ${BUILD_DIR}/*.elf
  artifacts:
    paths:
      - ${BUILD_DIR}/*.elf
      - ${BUILD_DIR}/*.map
      - ${BUILD_DIR}/*.bin
    expire_in: 1 week

cppcheck:
  stage: analyze
  needs: ["configure"]
  script:
    - cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=preprocessorErrorDirective Core/Src Core/Inc