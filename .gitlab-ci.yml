stages:
  - docker
  - prepare
  - build
  - analyze
  - pages

variables:
  FIRMWARE_DIR: "stm32l475-rtos"
  BUILD_DIR: "stm32l475-rtos/build/Debug"
  STM32_CI_IMAGE: "$CI_REGISTRY_IMAGE/stm32-ci:latest"

default:
  image: "$STM32_CI_IMAGE"
  tags:
    - runner
  interruptible: true

.docker_login: &docker_login
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

build_image:
  stage: docker
  image: docker
  services:
    - docker:dind
  tags:
    - runner
  before_script:
    - *docker_login
  script:
    - docker build --pull -t "$STM32_CI_IMAGE" -f gitlab-runner/Dockerfile .
    - docker push "$STM32_CI_IMAGE"
  rules:
    - changes:
        - gitlab-runner/Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - when: manual
      allow_failure: true

format:
  stage: prepare
  script:
    - cd "$FIRMWARE_DIR"
    - find App Config Core Port RTOS -type f \( -name '*.c' -o -name '*.h' \) -print0 |
      xargs -0 clang-format --dry-run --Werror

configure:
  stage: prepare
  script:
    - cd "$FIRMWARE_DIR"
    - cmake --preset Debug
  artifacts:
    paths:
      - "$BUILD_DIR/"
    expire_in: 1 week

build:
  stage: build
  needs:
    - job: configure
      artifacts: true
  script:
    - cd "$FIRMWARE_DIR"
    - cmake --build build/Debug --parallel
    - arm-none-eabi-size build/Debug/*.elf
  artifacts:
    paths:
      - "$BUILD_DIR/*.elf"
      - "$BUILD_DIR/*.map"
      - "$BUILD_DIR/*.bin"
    expire_in: 1 week

cppcheck:
  stage: analyze
  needs:
    - job: configure
      artifacts: true
  script:
    - cd "$FIRMWARE_DIR"
    - cppcheck
      --project=build/Debug/compile_commands.json
      --enable=warning,style,performance,portability
      --error-exitcode=1
      --suppress=missingIncludeSystem
      --suppress=preprocessorErrorDirective
      -iLibs/SEGGER
      -iCore/Src/syscalls.c

pages:
  stage: pages
  image:
    name: nakatt/doxygen:1.11
    entrypoint: [""]
  script:
    - cd "$FIRMWARE_DIR"
    - doxygen Doxyfile
    - cd ..
    - rm -rf public
    - cp -r "$FIRMWARE_DIR/docs/html" public
    - test -f public/index.html
  artifacts:
    paths:
      - public
