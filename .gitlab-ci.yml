workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

stages:
  - docker
  - prepare
  - build
  - analyze
  - pages

variables:
  FIRMWARE_DIR: "stm32l475-rtos"
  STM32_CI_IMAGE: "$CI_REGISTRY_IMAGE/stm32-ci:latest"
  DOXYGEN_CI_IMAGE: "$CI_REGISTRY_IMAGE/doxygen-ci:latest"
  VERIFICATION_CI_IMAGE: "$CI_REGISTRY_IMAGE/verification-ci:latest"

default:
  image: "$STM32_CI_IMAGE"
  tags:
    - runner
  interruptible: true

# ---------------------------------------------------------------------------
# Docker images
# ---------------------------------------------------------------------------

.docker_login: &docker_login
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

stm32_image:
  stage: docker
  image: docker
  services:
    - docker:dind
  tags:
    - runner

  before_script:
    - *docker_login

  script:
    - docker build --pull -t "$STM32_CI_IMAGE" -f gitlab-runner/stm32.Dockerfile .
    - docker push "$STM32_CI_IMAGE"

  rules:
    - changes:
        - gitlab-runner/stm32.Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - when: manual
      allow_failure: true

doxygen_image:
  stage: docker
  image: docker
  services:
    - docker:dind
  tags:
    - runner

  before_script:
    - *docker_login

  script:
    - docker build --pull -t "$DOXYGEN_CI_IMAGE" -f gitlab-runner/doxygen.Dockerfile .
    - docker push "$DOXYGEN_CI_IMAGE"

  rules:
    - changes:
        - gitlab-runner/doxygen.Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - when: manual
      allow_failure: true

verification_image:
  stage: docker
  image: docker
  services:
    - docker:dind
  tags:
    - runner

  before_script:
    - *docker_login

  script:
    - docker build --pull -t "$VERIFICATION_CI_IMAGE" -f verification/Dockerfile verification
    - docker push "$VERIFICATION_CI_IMAGE"

  rules:
    - changes:
        - verification/Dockerfile
        - verification/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual
      allow_failure: true

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------

format:
  stage: prepare

  script:
    - cd "$FIRMWARE_DIR"
    - >
      find App Config Core Port RTOS -type f
      \( -name '*.c' -o -name '*.h' \)
      -print0 |
      xargs -0 clang-format --dry-run --Werror

# ---------------------------------------------------------------------------
# Firmware builds
# ---------------------------------------------------------------------------

build:
  stage: build

  parallel:
    matrix:
      - VARIANT: "sensor"
        RTOS_PROJECT: "PROJECT_SENSOR"
        RTOS_TRACE_ENABLED: "1"
      - VARIANT: "queue"
        RTOS_PROJECT: "PROJECT_QUEUE"
        RTOS_TRACE_ENABLED: "1"
      - VARIANT: "scheduler"
        RTOS_PROJECT: "PROJECT_SCHEDULER"
        RTOS_TRACE_ENABLED: "1"
      - VARIANT: "delay"
        RTOS_PROJECT: "PROJECT_DELAY"
        RTOS_TRACE_ENABLED: "1"
      - VARIANT: "semaphore"
        RTOS_PROJECT: "PROJECT_SEMAPHORE"
        RTOS_TRACE_ENABLED: "1"
      - VARIANT: "mutex"
        RTOS_PROJECT: "PROJECT_MUTEX"
        RTOS_TRACE_ENABLED: "1"
      - VARIANT: "sensor-no-trace"
        RTOS_PROJECT: "PROJECT_SENSOR"
        RTOS_TRACE_ENABLED: "0"

  script:
    - cd "$FIRMWARE_DIR"
    - >
      cmake --preset Debug
      -B "build/ci-${VARIANT}"
      -DRTOS_PROJECT="${RTOS_PROJECT}"
      -DRTOS_TRACE_ENABLED="${RTOS_TRACE_ENABLED}"
    - cmake --build "build/ci-${VARIANT}" --parallel
    - arm-none-eabi-size "build/ci-${VARIANT}"/*.elf

# ---------------------------------------------------------------------------
# Static analysis
# ---------------------------------------------------------------------------

cppcheck:
  stage: analyze

  script:
    - cd "$FIRMWARE_DIR"
    - >
      cmake --preset Debug
      -DRTOS_PROJECT=PROJECT_SENSOR
      -DRTOS_TRACE_ENABLED=1
    - >
      cppcheck
      --project=build/Debug/compile_commands.json
      --enable=warning,style,performance,portability
      --error-exitcode=1
      --suppress=missingIncludeSystem
      --suppress=preprocessorErrorDirective
      -iLibs/SEGGER
      -iCore/Src/syscalls.c

# ---------------------------------------------------------------------------
# TeSSLa verification
# ---------------------------------------------------------------------------

verification:
  stage: analyze

  image:
    name: "$VERIFICATION_CI_IMAGE"
    entrypoint: [""]

  script:
    - cd verification
    - python3 tessla_verify.py list
    - python3 tessla_verify.py test --rust

  rules:
    - changes:
        - verification/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never

# ---------------------------------------------------------------------------
# Doxygen / GitLab Pages
# ---------------------------------------------------------------------------

pages:
  stage: pages

  image:
    name: "$DOXYGEN_CI_IMAGE"
    entrypoint: [""]

  script:
    - cd "$FIRMWARE_DIR"
    - doxygen Doxyfile
    - cd ..
    - rm -rf public
    - cp -r "$FIRMWARE_DIR/docs/html" public
    - test -f public/index.html

  artifacts:
    paths:
      - public

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
