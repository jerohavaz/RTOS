workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always


stages:
  - docker
  - prepare
  - build
  - analyze
  - pages


variables:
  FIRMWARE_DIR: "stm32l475-rtos"

  STM32_CI_IMAGE: "$CI_REGISTRY_IMAGE/stm32-ci:latest"
  DOXYGEN_CI_IMAGE: "$CI_REGISTRY_IMAGE/doxygen-ci:latest"
  VERIFICATION_CI_IMAGE: "$CI_REGISTRY_IMAGE/verification-ci:latest"


default:
  image: "$STM32_CI_IMAGE"
  tags:
    - runner
  interruptible: true


# =============================================================================
# Docker images
# =============================================================================

.docker_login: &docker_login
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin


stm32_image:
  stage: docker

  image: docker

  services:
    - docker:dind

  tags:
    - runner

  before_script:
    - *docker_login

  script:
    - >
      docker build
      --pull
      -t "$STM32_CI_IMAGE"
      -f ci/images/stm32/Dockerfile
      ci/images/stm32
    - docker push "$STM32_CI_IMAGE"

  rules:
    - changes:
        - ci/images/stm32/Dockerfile
      when: on_success

    - when: manual
      allow_failure: true


doxygen_image:
  stage: docker

  image: docker

  services:
    - docker:dind

  tags:
    - runner

  before_script:
    - *docker_login

  script:
    - >
      docker build
      --pull
      -t "$DOXYGEN_CI_IMAGE"
      -f ci/images/doxygen/Dockerfile
      ci/images/doxygen
    - docker push "$DOXYGEN_CI_IMAGE"

  rules:
    - changes:
        - ci/images/doxygen/Dockerfile
      when: on_success

    - when: manual
      allow_failure: true


verification_image:
  stage: docker

  image: docker

  services:
    - docker:dind

  tags:
    - runner

  before_script:
    - *docker_login

  script:
    - >
      docker build
      --pull
      -t "$VERIFICATION_CI_IMAGE"
      -f ci/images/verification/Dockerfile
      ci/images/verification
    - docker push "$VERIFICATION_CI_IMAGE"

  rules:
    - changes:
        - ci/images/verification/Dockerfile
      when: on_success

    - when: manual
      allow_failure: true


# =============================================================================
# Formatting
# =============================================================================

format:
  stage: prepare

  dependencies: []

  script:
    - cd "$FIRMWARE_DIR"

    - >
      find App Config Core Port RTOS
      -type f
      \( -name '*.c' -o -name '*.h' \)
      -print0 |
      xargs -0 clang-format
      --dry-run
      --Werror


# =============================================================================
# Firmware builds
#
# Each configuration receives its own build directory and artifact directory.
#
# Artifacts:
#   - ELF
#   - MAP
#   - HEX
#   - BIN
#   - size report
#   - compile_commands.json
#
# compile_commands.json is reused by cppcheck.
# =============================================================================

build:
  stage: build

  parallel:
    matrix:
      - VARIANT: "sensor"
        RTOS_PROJECT: "PROJECT_SENSOR"
        RTOS_TRACE_ENABLED: "1"

      - VARIANT: "queue"
        RTOS_PROJECT: "PROJECT_QUEUE"
        RTOS_TRACE_ENABLED: "1"

      - VARIANT: "scheduler"
        RTOS_PROJECT: "PROJECT_SCHEDULER"
        RTOS_TRACE_ENABLED: "1"

      - VARIANT: "delay"
        RTOS_PROJECT: "PROJECT_DELAY"
        RTOS_TRACE_ENABLED: "1"

      - VARIANT: "semaphore"
        RTOS_PROJECT: "PROJECT_SEMAPHORE"
        RTOS_TRACE_ENABLED: "1"

      - VARIANT: "mutex"
        RTOS_PROJECT: "PROJECT_MUTEX"
        RTOS_TRACE_ENABLED: "1"

      - VARIANT: "sensor-no-trace"
        RTOS_PROJECT: "PROJECT_SENSOR"
        RTOS_TRACE_ENABLED: "0"

  script:
    - cd "$FIRMWARE_DIR"

    - BUILD_DIR="build/ci-${VARIANT}"
    - ARTIFACT_DIR="ci-artifacts/${VARIANT}"

    - mkdir -p "$ARTIFACT_DIR"

    # -------------------------------------------------------------------------
    # Configure
    # -------------------------------------------------------------------------

    - >
      cmake
      --preset Debug
      -B "$BUILD_DIR"
      -DRTOS_PROJECT="${RTOS_PROJECT}"
      -DRTOS_TRACE_ENABLED="${RTOS_TRACE_ENABLED}"

    # -------------------------------------------------------------------------
    # Build
    # -------------------------------------------------------------------------

    - cmake --build "$BUILD_DIR" --parallel

    # -------------------------------------------------------------------------
    # Firmware outputs
    # -------------------------------------------------------------------------

    - cp "$BUILD_DIR/rtos.elf" "$ARTIFACT_DIR/rtos.elf"
    - cp "$BUILD_DIR/rtos.map" "$ARTIFACT_DIR/rtos.map"

    - >
      arm-none-eabi-objcopy
      -O ihex
      "$BUILD_DIR/rtos.elf"
      "$ARTIFACT_DIR/rtos.hex"

    - >
      arm-none-eabi-objcopy
      -O binary
      "$BUILD_DIR/rtos.elf"
      "$ARTIFACT_DIR/rtos.bin"

    # -------------------------------------------------------------------------
    # Size report
    # -------------------------------------------------------------------------

    - >
      arm-none-eabi-size
      "$BUILD_DIR/rtos.elf" |
      tee "$ARTIFACT_DIR/size.txt"

  artifacts:
    name: "firmware-${VARIANT}-${CI_COMMIT_SHORT_SHA}"

    expire_in: 1 week

    paths:
      # Firmware that can be downloaded/flashed.
      - "$FIRMWARE_DIR/ci-artifacts/${VARIANT}/"

      # Keep only the compile database from the CMake build tree.
      # cppcheck consumes this in the next stage.
      - "$FIRMWARE_DIR/build/ci-${VARIANT}/compile_commands.json"


# =============================================================================
# Static analysis
#
# The build matrix has already generated compile_commands.json.
# Do NOT configure CMake again.
#
# `needs: build` downloads artifacts from all seven matrix jobs.
# =============================================================================

cppcheck:
  stage: analyze

  needs:
    - job: build
      artifacts: true

  script:
    - cd "$FIRMWARE_DIR"

    - mkdir -p cppcheck-reports

    - failed=0

    - |
      for db in build/ci-*/compile_commands.json; do

        variant="$(basename "$(dirname "$db")")"
        variant="${variant#ci-}"

        report="cppcheck-reports/${variant}.txt"

        echo
        echo "============================================================"
        echo "Cppcheck configuration: ${variant}"
        echo "Compile database:        ${db}"
        echo "============================================================"

        if cppcheck \
          --project="$db" \
          --enable=warning,style,performance,portability \
          --error-exitcode=1 \
          --suppress=missingIncludeSystem \
          --suppress=preprocessorErrorDirective \
          -iLibs/SEGGER \
          -iCore/Src/syscalls.c \
          2>"$report"
        then
          echo "Cppcheck ${variant}: OK"
        else
          echo "Cppcheck ${variant}: FAILED"
          failed=1
        fi

        cat "$report"
      done

    - exit "$failed"

  artifacts:
    when: always
    expire_in: 1 week

    paths:
      - "$FIRMWARE_DIR/cppcheck-reports/"


# =============================================================================
# TeSSLa verification
#
# Does not use firmware artifacts.
# It runs after build because it is in the analyze stage, but it does not
# download the build outputs.
# =============================================================================

verification:
  stage: analyze

  image:
    name: "$VERIFICATION_CI_IMAGE"

  dependencies: []

  script:
    - cd verification
    - python3 tessla_verify.py list
    - python3 tessla_verify.py test --rust

  rules:
    - changes:
        - verification/**/*
        - stm32l475-rtos/**/*
        - .gitlab-ci.yml
      when: on_success

    - when: never


# =============================================================================
# Doxygen / GitLab Pages
#
# Documentation is source-based and does not require firmware artifacts.
# =============================================================================

pages:
  stage: pages

  image:
    name: "$DOXYGEN_CI_IMAGE"

  dependencies: []

  script:
    - cd "$FIRMWARE_DIR"

    - doxygen Doxyfile

    - cd ..

    - rm -rf public
    - cp -r "$FIRMWARE_DIR/docs/html" public

    - test -f public/index.html

  artifacts:
    paths:
      - public

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

    - when: never